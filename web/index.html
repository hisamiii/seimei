<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e2e">
<title>seimei</title>
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="preload" href="static/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/style.css">
<link rel="stylesheet" href="static/loading.css">
<link rel="stylesheet" href="static/m3x.css">
<script src="static/theme-boot.js"></script>
<script type="module" src="static/app.js"></script>
</head>
<body>
<header class="bar">
  <span class="avatar"><i class="glyph g22" aria-hidden="true"></i></span>
  <div class="titles">
    <h1 id="title">seimei</h1>
    <span class="status" id="status" data-s="connecting"><span class="dot"></span><span id="status-text">connecting</span></span>
  </div>
  <button class="icon-btn sl" id="menu-btn" type="button" aria-label="Account" aria-haspopup="menu" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v.01M12 12v.01M12 18.5v.01"/></svg></button>
  <div class="menu" id="menu" role="menu" hidden>
    <button class="sl" id="add-passkey" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg>Add fingerprint login</button>
    <button class="sl" id="phones" role="menuitem" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="2.5"/><path d="M11 17.5h2"/></svg>Phone app</button>
    <button class="sl" id="theme" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 1 0-18c4.97 0 9 3.58 9 8 0 2.76-2.24 4-4.5 4H15a2 2 0 0 0-1.5 3.3A1.6 1.6 0 0 1 12 21z"/><path d="M7.5 11.5v.01M10 7.5v.01M14.5 7.5v.01M17 11v.01"/></svg>Theme</button>
    <button class="sl" id="audit" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6L12 3z"/><path d="M9 12h6M9 15.5h4"/></svg>Activity log</button>
    <button class="sl" id="logout" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>Log out</button>
  </div>
</header>

<nav class="ltabs" id="ltabs" role="tablist" aria-label="Chat, trajectory, or tasks">
  <button class="ltab sl on" type="button" role="tab" id="lt-chat" aria-selected="true">Chat</button>
  <button class="ltab sl" type="button" role="tab" id="lt-traj" aria-selected="false">Trajectory<span class="cnt" id="traj-count" hidden></span></button>
  <button class="ltab sl" type="button" role="tab" id="lt-tasks" aria-selected="false">Tasks</button>
</nav>

<main class="log" id="log" aria-label="Chat">
  <div class="thread" id="thread" aria-live="polite">
    <button class="older sl" id="older" hidden>Load earlier</button>
  </div>
  <div class="thread" id="traj" aria-live="polite" hidden>
    <button class="older sl" id="older-t" hidden>Load earlier</button>
    <p class="traj-empty" id="traj-empty">Nothing yet</p>
  </div>
  <div class="tasks" id="tasks" aria-live="polite" hidden></div>
  <div class="hello" id="hello" hidden></div>
  <div class="working" id="working" hidden><span class="loader"><i></i></span><span>Working…</span></div>
  <section class="card" id="fp-card" hidden>
    <span class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg></span>
    <div>
      <h3>Log in with your fingerprint next time?</h3>
      <div class="actions"><button class="btn filled sl morph" id="fp-yes" type="button">Set up</button><button class="btn tonal sl morph" id="fp-no" type="button">Not now</button></div>
    </div>
  </section>
  <section class="away" id="away" hidden>
    <span class="badge"><i class="glyph g48" aria-hidden="true"></i></span>
    <h2>Can't reach the server</h2>
    <p id="away-since">Reconnects on its own</p>
    <button class="sl" id="retry">Try now</button>
  </section>
</main>

<main class="page" id="agents" aria-label="Agents" hidden></main>
<main class="page" id="usage" aria-label="Usage" hidden></main>

<div class="bottom">
<form class="composer" id="composer">
  <div class="attachments" id="attachments" hidden></div>
  <div class="quote" id="quote" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="quote-text"></span><button class="sl" type="button" id="quote-x" aria-label="Cancel the reply"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="composer-inner">
    <div class="field">
      <button class="attach sl" type="button" id="attach" aria-label="Attach photos or files"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
      <textarea id="input" rows="1" placeholder="Message seimei" aria-label="Message seimei" enterkeyhint="send" autocomplete="off"></textarea>
    </div>
    <input type="file" id="file" multiple hidden>
    <button class="fab sl" type="submit" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    <button class="fab tonal sl morph" type="button" id="stop" aria-label="Stop" hidden><span class="square"></span></button>
  </div>
</form>
<div class="snack" id="snack" role="status" hidden></div>
<nav class="navbar" aria-label="Sections">
  <button class="nav-item sl" type="button" data-tab="chat" id="nav-chat"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h12A2.5 2.5 0 0 1 20.5 7v8a2.5 2.5 0 0 1-2.5 2.5h-7L6.5 21v-3.5H6A2.5 2.5 0 0 1 3.5 15V7A2.5 2.5 0 0 1 6 4.5z"/></svg><i class="ndot" id="nav-chat-dot" hidden></i></span>seimei</button>
  <button class="nav-item sl" type="button" data-tab="agents" id="nav-agents"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h3.5A1.5 1.5 0 0 1 11 5.5V9a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 9V5.5A1.5 1.5 0 0 1 6 4zM14.5 4H18a1.5 1.5 0 0 1 1.5 1.5V9A1.5 1.5 0 0 1 18 10.5h-3.5A1.5 1.5 0 0 1 13 9V5.5A1.5 1.5 0 0 1 14.5 4zM6 13.5h3.5A1.5 1.5 0 0 1 11 15v3.5A1.5 1.5 0 0 1 9.5 20H6a1.5 1.5 0 0 1-1.5-1.5V15A1.5 1.5 0 0 1 6 13.5zM14.5 13.5H18a1.5 1.5 0 0 1 1.5 1.5v3.5A1.5 1.5 0 0 1 18 20h-3.5a1.5 1.5 0 0 1-1.5-1.5V15a1.5 1.5 0 0 1 1.5-1.5z"/></svg><i class="nbadge" id="nav-count" hidden></i></span>Agents</button>
  <button class="nav-item sl" type="button" data-tab="usage" id="nav-usage"><span class="ind"><svg class="ring-ico" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle class="t" cx="12" cy="12" r="8.5"/><circle class="f" id="nav-ring" cx="12" cy="12" r="8.5" pathLength="100" stroke-dasharray="0 100"/></svg></span>Usage</button>
</nav>
</div>

<section class="spage" id="spage" aria-label="Agent" hidden></section>

<div class="viewer" id="viewer" hidden><div class="viewer-bar"><a class="icon-btn" id="viewer-save" download aria-label="Save the original" title="Save the original"></a><button class="icon-btn" id="viewer-close" type="button" aria-label="Close"></button></div><img id="viewer-img" alt="" draggable="false"></div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <button class="scrim" id="scrim" type="button" aria-label="Close"></button>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>
</body>
</html>
