<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e2e">
<title>seimei</title>
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="preload" href="static/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/style.css">
<link rel="stylesheet" href="static/loading.css">
<link rel="stylesheet" href="static/m3x.css">
<script src="static/theme-boot.js"></script>
<script type="module" src="static/app.js"></script>
</head>
<body>
<header class="bar">
  <button class="icon-btn lead sl" id="drawer-btn" type="button" aria-label="Open the menu" aria-haspopup="dialog"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><i class="ndot" id="drawer-dot" hidden></i></button>
  <div class="titles">
    <h1 id="title">seimei</h1><span class="harness" id="harness" hidden></span>
    <span class="status" id="status" data-s="connecting"><span class="dot"></span><span id="status-text">connecting</span></span>
  </div>
  <button class="icon-btn sl" id="new-thread" type="button" aria-label="New side thread" title="New side thread"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12M17.6 3.9a1.9 1.9 0 0 1 2.7 2.7L12.5 14.4 9 15l.6-3.5z"/></svg></button>
</header>

<nav class="ltabs" id="ltabs" role="tablist" aria-label="Chat, trajectory, or tasks">
  <button class="ltab sl on" type="button" role="tab" id="lt-chat" aria-selected="true">Chat</button>
  <button class="ltab sl" type="button" role="tab" id="lt-traj" aria-selected="false">Trajectory</button>
  <button class="ltab sl" type="button" role="tab" id="lt-tasks" aria-selected="false">Tasks</button>
</nav>

<main class="log" id="log" aria-label="Chat">
  <div class="thread" id="thread">
    <button class="older sl" id="older" hidden>Load earlier</button>
  </div>
  <div class="thread" id="traj" hidden>
    <button class="older sl" id="older-t" hidden>Load earlier</button>
    <p class="traj-empty" id="traj-empty">Nothing yet</p>
  </div>
  <div class="tasks" id="tasks" hidden></div>
  <div class="hello" id="hello" hidden></div>
  <div class="working" id="working" hidden><span class="loader"><i></i></span><span>Working…</span></div>
  <section class="card" id="fp-card" hidden>
    <span class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg></span>
    <div>
      <h3>Log in with your fingerprint next time?</h3>
      <div class="actions"><button class="btn filled sl morph" id="fp-yes" type="button">Set up</button><button class="btn tonal sl morph" id="fp-no" type="button">Not now</button></div>
    </div>
  </section>
  <section class="away" id="away" hidden>
    <span class="badge"><i class="glyph g48" aria-hidden="true"></i></span>
    <h2>Can't reach the server</h2>
    <p id="away-since">Reconnects on its own</p>
    <button class="sl" id="retry">Try now</button>
  </section>
</main>

<main class="page" id="threads" aria-label="Side threads" hidden></main>
<main class="page" id="agents" aria-label="Agents" hidden></main>
<main class="page" id="watches" aria-label="Watches" hidden></main>
<main class="page" id="files" aria-label="Files" hidden></main>
<main class="page" id="usage" aria-label="Usage" hidden></main>
<main class="page" id="settings" aria-label="Settings" hidden></main>

<div class="bottom">
<form class="composer" id="composer">
  <div class="attachments" id="attachments" hidden></div>
  <div class="quote" id="quote" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="quote-text"></span><button class="sl" type="button" id="quote-x" aria-label="Cancel the reply"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="composer-inner">
    <div class="field">
      <button class="attach sl" type="button" id="attach" aria-label="Attach photos or files"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
      <button class="attach sl" type="button" id="mic-drop" aria-label="Drop the recording" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <textarea id="input" rows="1" placeholder="Message seimei" aria-label="Message seimei" enterkeyhint="send" autocomplete="off"></textarea>
      <div class="level" id="mic-level" aria-hidden="true" hidden></div>
      <span class="time" id="mic-time" hidden></span>
      <button class="mic sl" type="button" id="mic" aria-label="Dictate" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg><span class="square"></span><span class="spin"></span></button>
    </div>
    <input type="file" id="file" multiple hidden>
    <button class="fab sl" type="submit" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    <button class="fab tonal sl morph" type="button" id="stop" aria-label="Stop" hidden><span class="square"></span></button>
  </div>
</form>
<div class="sr" id="say" role="status"></div>
<div class="snack" id="snack" role="status" hidden></div>
</div>

<section class="spage" id="spage" aria-label="Agent" hidden></section>

<div class="dwrap" id="drawer" hidden>
  <button class="scrim" id="drawer-scrim" type="button" aria-label="Close the menu"></button>
  <nav class="drawer" id="drawer-nav" aria-label="Menu"><div class="dscroll" id="drawer-list"></div><div class="dfoot" id="drawer-foot"></div></nav>
</div>

<div class="viewer" id="viewer" hidden><div class="viewer-bar"><a class="icon-btn" id="viewer-save" download aria-label="Save the original" title="Save the original"></a><button class="icon-btn" id="viewer-close" type="button" aria-label="Close"></button></div><img id="viewer-img" alt="" draggable="false"></div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <button class="scrim" id="scrim" type="button" aria-label="Close"></button>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>
</body>
</html>
