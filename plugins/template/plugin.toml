# A seimei plugin: copy this folder to ~/.config/seimei/plugins/<name>/ and add <name> to [plugins] enabled.
# The folder's name is the plugin's name; its tools show up as mcp__<name>__<tool>.

# Claude Code starts this command as an MCP server on stdio, once for each session that has the plugin.
# A leading ~ is your home; it runs from the session's folder, so give the full path.
command = "~/.config/seimei/plugins/template/server.py"
args = []
# The prompt section seimei adds next to the tools: a file in this folder.
prompt = "prompt.md"
# Optional: one line in every shikigami's prompt, for one that was not given the plugin.
worker_note = "The template plugin keeps notes; ask seimei for it if you need one."
