# The writing rules in AGENTS.md, checked by https://github.com/hisamiii/lint (`lint install`, then `lint --all`).

[files]
exclude = ["android/gradlew", "android/gradlew.bat"]

# Harness and terminal names live in their own adapter, its fakes and the docs; generic code says agent, harness or terminal.
[scoped]
claude = [
    "crates/core/src/workers/claude.rs", "crates/proto", "tests/fakes/claude.py", "tests/live.sh", "tests/qa/start.sh",
    "plugins/queue", "contrib/maintainer", "contrib/guard.example.toml", "config.example.toml",
    "docs/**", "*.md", "CLAUDE.md", ".lint.toml",
]
kitty = [
    "crates/core/src/terminal.rs", "tests/fakes/bin/kitten", "tests/live.sh", "tests/qa", "contrib/guard.example.toml",
    "docs/**", "*.md", ".lint.toml",
]

# Model prompts are read by the agent, not by a person: the prose rules for docs do not apply to them.
[[override]]
paths = ["crates/core/src/dispatcher.md", "crates/core/src/checklist.md", "plugins/*/prompt.md"]
disable = ["doc-sentence-length", "doc-parens", "doc-table-cell", "doc-section-intro"]

# Commented-out settings are a reference to uncomment, not prose.
[[override]]
paths = ["config.example.toml", "contrib/guard.example.toml"]
disable = ["comment-length"]
