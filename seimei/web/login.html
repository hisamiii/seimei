<body class="login">
<main class="signin">
  <span class="mark"><i class="glyph g40" aria-hidden="true"></i></span>
  <h1>seimei</h1>
  <p class="sub">Unlock to reach your server.</p>
  <button class="btn filled sl" id="passkey" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg>
    Use fingerprint
  </button>
  <div class="or" id="or"><span>or</span></div>
  <form class="pwform" id="pwform">
    <label class="field"><span class="sr">Password</span><input type="password" id="pw" placeholder="Password" autocomplete="current-password" required></label>
    <button class="btn tonal sl" type="submit" id="pwbtn">Log in</button>
  </form>
  <p class="err" id="err" role="alert"></p>
</main>
