<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e2e">
<title>seimei</title>
<link rel="icon" href="static/star.svg" type="image/svg+xml">
<link rel="preload" href="static/fonts/roboto-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/style.css">
<script type="module" src="static/app.js"></script>
</head>
<body>
<header class="bar">
  <span class="avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 17.88 20.09 2.49 8.91h19.02L6.12 20.09Z"/></svg></span>
  <div>
    <h1>seimei</h1>
    <span class="status" id="status" data-s="connecting"><span class="dot"></span><span id="status-text">connecting</span></span>
  </div>
  <button class="icon-btn sl" id="screen-btn" type="button" aria-label="Screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="2.5"/><path d="M9 20.5h6M12 16.5v4"/></svg></button>
  <button class="usage-btn sl" id="usage-btn" type="button" aria-label="Usage" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle class="fill" id="usage-ring" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="0 100"/></svg><span id="usage-pct"></span></button>
  <button class="icon-btn sl" id="menu-btn" type="button" aria-label="Account" aria-haspopup="menu" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v.01M12 12v.01M12 18.5v.01"/></svg></button>
  <div class="menu" id="menu" role="menu" hidden>
    <button class="sl" id="add-passkey" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg>Add fingerprint login</button>
    <button class="sl" id="audit" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6L12 3z"/><path d="M9 12h6M9 15.5h4"/></svg>Activity log</button>
    <button class="sl" id="logout" role="menuitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>Log out</button>
  </div>
</header>

<nav class="chips" id="chips" aria-label="Shikigami"></nav>

<main class="log" id="log">
  <div class="thread" id="thread" aria-live="polite">
    <button class="older sl" id="older" hidden>Load earlier</button>
  </div>
  <div class="working" id="working" hidden>working</div>
  <section class="card" id="fp-card" hidden>
    <span class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"/></svg></span>
    <div>
      <h3>Use your fingerprint next time?</h3>
      <p>Save a passkey on this device and skip the password.</p>
      <div class="actions"><button class="btn text sl" id="fp-yes" type="button">Set up</button><button class="btn text sl" id="fp-no" type="button">Not now</button></div>
    </div>
  </section>
  <section class="away" id="away" hidden>
    <span class="badge"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 17.88 20.09 2.49 8.91h19.02L6.12 20.09Z"/></svg></span>
    <h2>The laptop went quiet</h2>
    <p>It is probably asleep. Everything is paused where it was, and this page reconnects on its own when it wakes.</p>
    <button class="sl" id="retry">Try now</button>
  </section>
</main>

<form class="composer" id="composer">
  <div class="attachments" id="attachments" hidden></div>
  <div class="composer-inner">
    <div class="field">
      <button class="attach sl" type="button" id="attach" aria-label="Attach a photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 15.5-4.2-4.2a1.5 1.5 0 0 0-2.1 0L5.5 19.5"/></svg></button>
      <textarea id="input" rows="1" placeholder="Message seimei" aria-label="Message seimei" enterkeyhint="send" autocomplete="off"></textarea>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button class="fab sl" type="submit" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    <button class="fab tonal sl" type="button" id="stop" aria-label="Stop" hidden><span class="square"></span></button>
  </div>
</form>

<div class="viewer" id="viewer" hidden><img id="viewer-img" alt=""></div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <button class="scrim" id="scrim" type="button" aria-label="Close"></button>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>
</body>
</html>
