<!doctype html>
<html lang="en" style="--surface: #1e1e2e; --surface-low: #181825; --primary: #cba6f7; --primary-container: #3d3552; --text-3: #a6adc8; color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3X loading indicator, the shapes it morphs through</title>
<link rel="stylesheet" href="../../../web/style.css">
<link rel="stylesheet" href="m3x-tokens.css">
<link rel="stylesheet" href="m3x-loading.css">
<style>
  body { display: flex; flex-wrap: wrap; gap: 20px 12px; justify-content: center; align-content: center; padding: 24px; min-height: 100vh; background: var(--surface-low); }
  figure { margin: 0; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { font-size: 12px; color: var(--text-3); }
  .m3x-loading > i { animation-play-state: paused; }
</style>
</head>
<body>
  <figure><span class="m3x-loading"><i style="animation-delay: -0.0s, -0.0s"></i></span><figcaption>soft burst</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -0.7s, -0.7s"></i></span><figcaption>cookie 9</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -1.4s, -1.4s"></i></span><figcaption>pentagon</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -2.1s, -2.1s"></i></span><figcaption>pill</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -2.8s, -2.8s"></i></span><figcaption>sunny</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -3.5s, -3.5s"></i></span><figcaption>cookie 4</figcaption></figure>
  <figure><span class="m3x-loading"><i style="animation-delay: -4.2s, -4.2s"></i></span><figcaption>oval</figcaption></figure>
  <p style="width: 100%; text-align: center; color: var(--text-3); font-size: 13px; margin: 8px 0 0;">The stops of the morph, paused. Live, the shape springs from one to the next (expressive spatial default) while it turns: open working-after.html.</p>
</body>
</html>
