[project]
name = "seimei"
version = "0.1.0"
description = "Phone-driven dispatcher for Claude Code sessions, the desktop and apps"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "claude-agent-sdk==0.2.168",
    "pillow>=11",
    "webauthn==2.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not web and not live'"
pythonpath = ["."]
