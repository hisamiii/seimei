# Optional: copy to ~/.config/seimei/config.toml. Set values are the defaults; commented ones come from your plan and this machine.

[server]
port = 8417                         # --dev uses port + 1
origin = "http://localhost:8417"    # where the app and the web reach seimei (a tunnel's https URL); also the passkey domain
# web = false                       # no phone server: the plugins only

[dispatcher]
# model = "opus"                    # default: [models] work
cwd = "~"
# compact_window = 400000           # tokens at which its context compacts; default: what the plan's model holds
# harness = "acp:codex"             # what it runs on: claude (the default) or an [agents] entry

# What your plan affords; `seimei setup` writes these for Max or Pro (the Max values shown).
[models]
# work = "opus"                     # for real work, and a shikigami's model when none is picked
# routine = "sonnet"                # for routine jobs
# quick = "haiku"                   # for lookups, and every shikigami's own subagents
# context = "1m"                    # the most context a shikigami gets: 200k, 256k, 400k or 1m
# fable = "claude-fable-5-2"        # the model summon's fable choice runs

[host]
about = "computer"                  # how the prompts name this machine, e.g. "desktop (a Linux workstation)"

[sessions]
# terminal = "foot -D {cwd} -T {title}"   # opens a session for the user (a release, a loan); default: the one setup found

# Permission modes, by Claude Code's names: default, acceptEdits, plan, auto, dontAsk or bypassPermissions. What Claude Code would ask in a terminal becomes a card on the phone.
# The shikigami mode is also a ceiling: summon may only pick a stricter one, and only you raise it (on the Agents page).
[approvals]
dispatcher = "default"
shikigami = "default"
# Paths no agent may read or edit, as Claude Code deny rules; a trailing / for a folder. The default is seimei's own secrets in its data folder and dev/.
# deny_paths = ["~/.local/share/seimei/auth.json", "~/.local/share/seimei/signing/"]

# Plugins: optional tool groups on top of the core, each with its tools (mcp__<name>__<tool>), its prompt section and its approval cards.
# None are on by default; seimei always gets every enabled one and a shikigami the ones summon grants it (tools: ["desktop"]).
[plugins]
enabled = []
# Built in:
#   desktop  the desktop (niri, sway, Hyprland, KDE Plasma, GNOME or X11): windows, workspaces, screenshots, input (uinput), AT-SPI.
#   browser  Firefox or a Chromium browser through the extension in plugins/browser/extension/.
#   music    Quod Libet and the session's media players (MPRIS).
#   queue    GPU turns: every session's GPU and NPU commands take turns (claude-queue's shim and prefix).

# [plugins.desktop]
# backend = "niri"     # niri, sway, hyprland, kde, gnome or x11 (any EWMH window manager); found from the session when left out
#                      # kde and gnome are Plasma 6 and GNOME 45 or later on Wayland
#                      # gnome needs seimei's GNOME Shell extension, which `seimei setup` installs (it loads at the next login)
# shell = "fish"       # the shell a restored Claude session runs in; $SHELL when left out
# agent_idle_minutes = 30   # niri, kde, gnome: the agent display stops after this long without an agent using it

# [plugins.browser]
# extension_id = "seimei@localhost"   # the extension's id; deploy.sh keeps the installed one when left out

# [plugins.queue]
# lib = "~/.local/lib/claude-queue"   # where claude-queue's library lives

# Anything else in enabled is an external MCP server, as Claude Code's mcpServers takes it (command/args/env, or url/headers), plus the prompt section it brings:
# [plugins.mytool]
# command = "mytool-mcp"
# args = ["--stdio"]
# prompt = """## My tool
# What it is for and its rules."""

# ACP agents a shikigami can run on instead of Claude Code (harness "acp:<name>"): seimei talks ACP over their stdio, and they keep their own login and model settings.
# Every call goes through the shikigami's mode, so the agent must ask before each one: for dsh, add contrib/dsh/ to its acp profile (see contrib/dsh/cordis.patch.yml).
# [agents.dsh]
# command = "dsh"
# args = ["--profile", "acp"]
# env = { }            # extra environment, if it needs any
# Codex runs through its own app-server protocol instead (protocol = "codex"); its sandbox and MCP servers come from its own config, and seimei adds the shikigami's.
# [agents.codex]
# command = "codex"
# args = ["app-server"]
# protocol = "codex"

[asr]
# Dictation (docs/asr.md): the app's and the page's mic, and dictate on the laptop through <state>/asr.sock.
# key_file = "~/.config/seimei/openrouter-key"   # an OpenRouter key; without one the mic is not shown
# model = "microsoft/mai-transcribe-2"
# fallback = "mistralai/voxtral-mini-transcribe-3-0"
# language = "en"
# vocab_max = 100                   # terms sent with a clip at most
# zdr = false                       # only providers that keep no data
# deny = []                         # words and globs never sent

[asr.sources]
# chat = true                       # rare words of the open chat's last 20 messages, its agent and project
# names = true                      # running shikigami, sessions, projects
# board = true                      # rare words of open board items
# window = true                     # the laptop's focused window and its repo
# draft = true                      # rare words of the composer's draft
# auto = true                       # the nightly list of your own rare words
