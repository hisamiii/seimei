# Optional: copy to ~/.config/seimei/config.toml. These are the defaults.

[server]
port = 8417                         # --dev uses port + 1
origin = "http://localhost:8417"    # where the app and the web reach seimei (a tunnel's https URL); also the passkey domain

[dispatcher]
model = "opus"
cwd = "~"
compact_window = 400000             # tokens at which its context compacts

# What your plan affords; `seimei setup` writes these for Max or Pro.
[models]
work = "opus"                       # for real work, and a shikigami's model when none is picked
routine = "sonnet"                  # for routine jobs
quick = "haiku"                     # for lookups, and every shikigami's own subagents
context = "1m"                      # the most context a shikigami gets: 200k, 256k, 400k or 1m

[host]
about = "computer"                  # how the prompts name this machine, e.g. "desktop (an Arch box running niri)"

[sessions]
terminal = "kitty -d {cwd} --title {title}"   # opens a session for the user (a release, a loan); the command follows

# Permission modes, by Claude Code's names: default, acceptEdits, plan, auto, dontAsk or bypassPermissions. Whatever
# Claude Code would ask in a terminal becomes a card on the phone, with the terminal's choices. The shikigami mode is
# also a ceiling: summon may only pick a stricter one, and only you raise it (on the Agents page). seimei's guard
# runs before any of it, in every mode.
[approvals]
dispatcher = "default"
shikigami = "default"

# Plugins: optional tool groups on top of the core. None are on by default; seimei always gets every enabled one and
# a shikigami the ones summon grants it (tools: ["desktop"]). Each brings its tools (mcp__<name>__<tool>), its prompt
# section and its approval cards.
[plugins]
enabled = []
# Built in:
#   desktop  the desktop (niri, sway, Hyprland, KDE Plasma, GNOME or X11): windows, workspaces, screenshots, input (uinput), AT-SPI
#   discord  Discord through the Vesktop plugin in discord/
#   browser  Waterfox (or Firefox) through the extension in plugins/browser/extension/
#   music    Quod Libet and the session's media players (MPRIS)
#   queue    claude-queue / cqd: every session's commands take GPU turns through it

# [plugins.desktop]
# backend = "niri"     # niri, sway, hyprland, kde, gnome or x11 (any EWMH window manager); found from the session when
#                      # left out. kde and gnome are Plasma 6 and GNOME 45 or later on Wayland; gnome needs seimei's
#                      # GNOME Shell extension, which `seimei setup` installs (it loads at the next login).
# shell = "fish"       # the shell a restored Claude session runs in; $SHELL when left out
# agent_idle_minutes = 30   # niri, kde, gnome: the agent display stops after this long without an agent using it

# [plugins.browser]
# extension_id = "seimei@localhost"   # the extension's id; deploy.sh keeps the installed one when left out

# [plugins.queue]
# lib = "~/.local/lib/claude-queue"   # where claude-queue's library lives

# Anything else in enabled is an external MCP server, as Claude Code's mcpServers takes it (command/args/env, or
# url/headers), plus the prompt section it brings:
# [plugins.mytool]
# command = "mytool-mcp"
# args = ["--stdio"]
# prompt = """## My tool
# What it is for and its rules."""

# ACP agents a shikigami can run on instead of Claude Code: summon it with harness "acp:<name>". seimei starts the
# agent and talks the Agent Client Protocol over its stdio; the agent keeps its own login and model settings.
# Every call of an agent goes through seimei's guard and the shikigami's mode, so the agent must ask before each one:
# for dsh, add contrib/dsh/ to its acp profile (see contrib/dsh/cordis.patch.yml), or it runs calls unasked.
# [agents.dsh]
# command = "dsh"
# args = ["--profile", "acp"]
# env = { }            # extra environment, if it needs any
# Codex runs through its own app-server protocol instead (protocol = "codex"); its sandbox and MCP servers come from
# its own config, and seimei adds the shikigami's.
# [agents.codex]
# command = "codex"
# args = ["app-server"]
# protocol = "codex"
