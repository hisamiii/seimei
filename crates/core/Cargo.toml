[package]
name = "seimei-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
imagesize = "0.15.0"
libc.workspace = true
openssl = { version = "0.10.81", features = ["vendored"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "native-tls-vendored"] }
seimei-proto = { path = "../proto" }
serde = { workspace = true, features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = "2.0.1"
similar = "3.2.0"
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros", "net"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls-vendored"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
url = "2.5.8"
webauthn-rs = { version = "0.5.5", features = ["danger-credential-internals", "danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
webp = "0.3.1"
