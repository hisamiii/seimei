[package]
name = "seimei-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
imagesize = "0.15.0"
openssl = { version = "0.10.81", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "native-tls-vendored"] }
serde = { workspace = true, features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
url = "2.5.8"
webauthn-rs = { version = "0.5.5", features = ["danger-credential-internals", "danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
webp = "0.3.1"
