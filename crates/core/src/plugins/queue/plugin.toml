# The queue plugin, built into seimei: Claude Code starts `seimei plugin queue` for each session that has it.
name = "queue"
command = "seimei"
args = ["plugin", "queue"]
prompt = "prompt.md"
# Every shikigami gets this line while the plugin is on, granted or not: the queue wraps every session.
# {launch} becomes the launcher for this init: systemd-run under systemd, niri's spawn without it.
worker_note = "Your commands take GPU/NPU turns through claude-queue. To start or restart a desktop app, run it outside the queue with `{launch}`: started straight from your shell, it holds the GPU turn until it quits and stalls everyone else's GPU jobs."
