[package]
name = "seimei"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
libc.workspace = true
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls-vendored"] }
seimei-core = { path = "../core" }
seimei-plugin-browser = { path = "../../plugins/browser" }
seimei-plugin-desktop = { path = "../../plugins/desktop" }
seimei-plugin-music = { path = "../../plugins/music" }
seimei-plugin-queue = { path = "../../plugins/queue" }
seimei-queue = { path = "../queue" }
seimei-server = { path = "../server" }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1.1.8"

# musl's malloc is slow under tokio's many threads; the static release build uses mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
minisign = "0.10.0"

[[test]]
name = "desktop"
harness = false
