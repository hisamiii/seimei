[package]
name = "seimei"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
libc.workspace = true
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls-vendored"] }
seimei-core = { path = "../core" }
seimei-server = { path = "../server" }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1.1.8"

[dev-dependencies]
minisign = "0.10.0"

[[test]]
name = "desktop"
harness = false
