<!doctype html>
<html lang="en" style="--surface: #1e1e2e; --surface-low: #181825; --surface-lowest: #11111b; --container: #26263a; --container-high: #313244; --container-highest: #3a3b50; --primary: #cba6f7; --on-primary: #2d1b47; --primary-container: #3d3552; --on-primary-container: #ecdcff; --inverse-primary: #8839ef; --tint: #2a2633; --tonal: #35384d; --on-tonal: #dfe3ff; --ok: #a6e3a1; --warn: #fab387; --error: #f38ba8; --text: #cdd6f4; --text-2: #bac2de; --text-3: #a6adc8; --outline: #6c7086; --warn-container: #45393e; --on-warn-container: #ffdcc4; --ok-container: #364142; --on-ok-container: #c8f3c3; --error-container: #45293a; --on-error-container: #ffd0dc; --on-warn: #3b2313; color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e2e">
<title>seimei</title>

<link rel="stylesheet" href="../../../../web/style.css">
<link rel="stylesheet" href="m3x-tokens.css">
<link rel="stylesheet" href="m3x-loading.css">
<link rel="stylesheet" href="offline-after.css">

</head>
<body data-tab="chat" class="offline">
<header class="bar">
  <span class="avatar"><i class="glyph g22" aria-hidden="true"></i></span>
  <div class="titles">
    <h1 id="title">seimei</h1>
    <span class="status" id="status" data-s="away"><span class="dot"></span><span id="status-text">away since 04:13 PM</span></span>
  </div>
  <button class="icon-btn sl" id="menu-btn" type="button" aria-label="Account" aria-haspopup="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v.01M12 12v.01M12 18.5v.01"></path></svg></button>
  <div class="menu" id="menu" role="menu" hidden=""></div>
</header>

<nav class="ltabs" id="ltabs" role="tablist" aria-label="Chat, trajectory or tasks">
  <button class="ltab sl on" type="button" role="tab" id="lt-chat" aria-selected="true">Chat</button>
  <button class="ltab sl" type="button" role="tab" id="lt-traj" aria-selected="false" aria-label="Trajectory">Trajectory<span class="cnt" id="traj-count" hidden="">0</span></button>
  <button class="ltab sl" type="button" role="tab" id="lt-tasks" aria-selected="false">Tasks</button>
</nav>

<main class="log" id="log" aria-label="Chat">
  <div class="thread" id="thread" aria-live="polite">
    <button class="older sl" id="older" hidden="">Load earlier</button>
  </div>
  <div class="thread" id="traj" aria-live="polite" hidden=""></div>
  <div class="tasks" id="tasks" aria-live="polite" hidden=""></div>
  <div class="hello" id="hello">
    <img src="../../../../web/icon.svg" alt="" width="56" height="56">
    <b>Ask seimei anything</b>
  </div>
  <div class="working" id="working" hidden="">working</div>
  <section class="card" id="fp-card">
    <span class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 20c.6-1.6 1-3.6 1-6.5a4 4 0 0 1 8 0c0 1.2-.1 2.4-.3 3.5M11.2 21c.5-2 .8-4.5.8-7.5M4.5 16.5c.3-1 .5-2 .5-3a7 7 0 0 1 12-4.9M19 11c.2.8.2 1.7.1 2.6M15 20.5c.3-.8.5-1.6.6-2.5"></path></svg></span>
    <div>
      <h3>Use your fingerprint next time?</h3>
      <p>Save a passkey on this device and skip the password.</p>
      <div class="actions"><button class="btn text sl" id="fp-yes" type="button">Set up</button><button class="btn text sl" id="fp-no" type="button">Not now</button></div>
    </div>
  </section>
  <section class="away" id="away">
    <span class="badge"><i class="glyph g48" aria-hidden="true"></i></span>
    <h2>The server went quiet</h2>
    <p>It is probably asleep. Everything is paused where it was, and this page reconnects on its own when it wakes.</p>
    <button class="sl" id="retry">Try now</button>
  </section>
</main>

<main class="page" id="agents" aria-label="Agents" hidden=""></main>
<main class="page" id="usage" aria-label="Usage" hidden=""></main>

<div class="bottom">
<form class="composer" id="composer">
  <div class="attachments" id="attachments" hidden=""></div>
  <div class="quote" id="quote" hidden=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg><span id="quote-text"></span><button class="sl" type="button" id="quote-x" aria-label="Cancel the reply"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
  <div class="composer-inner">
    <div class="field">
      <button class="attach sl" type="button" id="attach" aria-label="Attach photos or files"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"></path></svg></button>
      <textarea id="input" rows="1" placeholder="Message seimei" aria-label="Message seimei" enterkeyhint="send" autocomplete="off" style="height: 0px;"></textarea>
    </div>
    <input type="file" id="file" multiple="" hidden="">
    <button class="fab sl" type="submit" id="send" aria-label="Send" disabled=""><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"></path></svg></button>
    <button class="fab tonal sl" type="button" id="stop" aria-label="Stop" hidden=""><span class="square"></span></button>
  </div>
</form>
<div class="snack" id="snack" role="status" hidden=""></div>
<nav class="navbar" aria-label="Sections">
  <button class="nav-item sl on" type="button" data-tab="chat" id="nav-chat" aria-current="page"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h12A2.5 2.5 0 0 1 20.5 7v8a2.5 2.5 0 0 1-2.5 2.5h-7L6.5 21v-3.5H6A2.5 2.5 0 0 1 3.5 15V7A2.5 2.5 0 0 1 6 4.5z"></path></svg><i class="ndot" id="nav-chat-dot" hidden=""></i></span>Chat</button>
  <button class="nav-item sl" type="button" data-tab="agents" id="nav-agents" aria-label="Agents"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h3.5A1.5 1.5 0 0 1 11 5.5V9a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 9V5.5A1.5 1.5 0 0 1 6 4zM14.5 4H18a1.5 1.5 0 0 1 1.5 1.5V9A1.5 1.5 0 0 1 18 10.5h-3.5A1.5 1.5 0 0 1 13 9V5.5A1.5 1.5 0 0 1 14.5 4zM6 13.5h3.5A1.5 1.5 0 0 1 11 15v3.5A1.5 1.5 0 0 1 9.5 20H6a1.5 1.5 0 0 1-1.5-1.5V15A1.5 1.5 0 0 1 6 13.5zM14.5 13.5H18a1.5 1.5 0 0 1 1.5 1.5v3.5A1.5 1.5 0 0 1 18 20h-3.5a1.5 1.5 0 0 1-1.5-1.5V15a1.5 1.5 0 0 1 1.5-1.5z"/></svg><i class="nbadge" id="nav-count" hidden="">0</i></span>Agents</button>
  <button class="nav-item sl" type="button" data-tab="usage" id="nav-usage" data-tone="" aria-label="Usage"><span class="ind"><svg class="ring-ico" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle class="t" cx="12" cy="12" r="8.5"></circle><circle class="f" id="nav-ring" cx="12" cy="12" r="8.5" pathLength="100" stroke-dasharray="0 100"></circle></svg></span>Usage</button>
</nav>
</div>

<section class="spage" id="spage" aria-label="Agent" hidden=""></section>

<div class="viewer" id="viewer" hidden=""></div>

<div class="sheet-wrap" id="sheet-wrap" hidden=""></div>

</body></html>
