# dsh's acp profile for seimei: append these entries to ~/.dsh/profiles/acp/cordis.patch.yml and copy
# seimei-hooks.json next to it. seimei's guard then sees every call before it runs, and the shikigami's mode decides
# the rest (bypass: no cards; default: a card for each command and edit).
#
# The preset plugin is off in this profile, so settings.yaml's permission.defaultPreset (danger-full-access in the
# terminal, say) does not reach ACP sessions: they keep approval on ask, in a workspace-write sandbox, and a
# PreToolUse hook turns every tool call into a permission request to seimei. Model and provider stay in settings.yaml.

- id: permission
  disabled: true

- id: approval
  config:
    policy: ask

- id: sandbox-policy
  config:
    mode: workspace-write

- insert:
    - id: seimei-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js "(process.env.DSH_HOME ?? process.env.HOME + '/.dsh') + '/profiles/acp/seimei-hooks.json'"
