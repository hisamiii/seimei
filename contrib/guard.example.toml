# --- Commands ---

# A download run as a script: curl .. | sh, bash <(curl ..), eval "$(curl ..)".
#[[rule]]
#pipe    = [["{curl,wget,fetch,aria2c,http,https,xh}"], ["{sh,bash,zsh,dash,fish,ksh,eval,source,.}"]]
#action  = "deny"
#message = "running a download as a script"

# ...or into code read from stdin: python3 -. (A pipe into python3 -c 'code' is fine, so plain python3 is not here.)
#[[rule]]
#pipe    = [["{curl,wget,fetch,aria2c,http,https,xh}"], ["{python*,node,perl,ruby,php,lua}", "-"]]
#action  = "deny"
#message = "running a download as a script"

# ...and a download as the program itself: $(curl ..).
#[[rule]]
#argv    = ["{$(curl*,$(wget*}"]
#action  = "deny"
#message = "running a download as a script"

# Driving kitty by remote control: only you, from the app, type into sessions.
#[[rule]]
#argv    = ["{kitty,kitten}", "@"]
#action  = "deny"
#message = "driving kitty by remote control"

#[[rule]]
#argv    = ["kitten", "remote"]
#action  = "deny"
#message = "driving kitty by remote control"

#[[rule]]
#paths   = ["/run/user/*/kitty-*"]
#action  = "deny"
#message = "driving kitty by remote control"

# Its variables as a word of their own: grep KITTY_PUBLIC_KEY /proc/*/environ.
#[[rule]]
#argv    = ["*", "KITTY_{LISTEN_ON,PUBLIC_KEY}"]
#action  = "deny"
#message = "driving kitty by remote control"

# The input fallback: a regex on the command text, for what the parser does not see as a path or a program:
# the socket inside socat's UNIX-CONNECT:..., its variables, kitty driven from code.
#[[rule]]
#tool    = "Bash"
#input   = { command = '''\$\{?KITTY_(LISTEN_ON|PUBLIC_KEY)\b|["']KITTY_(LISTEN_ON|PUBLIC_KEY)["']|(/run/user/\d+|\$\{?XDG_RUNTIME_DIR\}?)/kitty-|["']kitt(y|en)["']\s*,\s*["'](\+kitten["']\s*,\s*["'])?@["']|\bseimei\.kitty\b|from\s+seimei\s+import\s+[^;\n]*\bkitty\b''' }
#action  = "deny"
#message = "driving kitty by remote control"

# --- Claude Code sessions: your card first ---

#[[rule]]
#argv    = ["claude", "{stop,kill,attach,rm,respawn}"]
#action  = "card"
#message = "stop, attach to, delete or restart a session"

# Also from a script or behind a wrapper (doas -u you claude stop x).
#[[rule]]
#tool    = "Bash"
#input   = { command = '''\bclaude\s+(stop|kill|attach|rm|respawn)\b|["']claude["']\s*,\s*["'](stop|kill|attach|rm|respawn|-r|--resume|-c|--continue)["']''' }
#action  = "card"
#message = "control a session from a script"

#[[rule]]
#argv    = ["claude", "{-r,--resume,--resume=*,-c,--continue}"]
#action  = "card"
#message = "resume a session"

#[[rule]]
#argv    = ["{pkill,killall}", "*claude*"]
#action  = "card"
#message = "kill claude processes"

# A session's messaging socket: a command writing to it (socat, nc, curl --unix-socket, > redirect).
# argv = ["*"] leaves out paths in code, which the next rule takes.
#[[rule]]
#argv    = ["*"]
#paths   = ["cc-socks/**"]
#op      = "write"
#action  = "card"
#message = "write to a session socket"

#[[rule]]
#tool    = "Bash"
#input   = { command = '''(?s)cc-socks.*(socket\s*\.\s*socket|AF_UNIX|\.connect\s*\(|net\s*\.\s*(connect|createConnection))|(socket\s*\.\s*socket|AF_UNIX|\.connect\s*\(|net\s*\.\s*(connect|createConnection)).*cc-socks''' }
#action  = "card"
#message = "write to a session socket"

# Claude Code's settings hold its allow rules: an agent writing them could grant itself anything.
#[[rule]]
#paths   = [".claude/settings{,.local}.json"]
#op      = "write"
#action  = "card"
#message = "change Claude Code's permission settings"

