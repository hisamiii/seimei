# seimei's guard rules: copy what you want to ~/.config/seimei/guard.toml and take the # off its lines.
# seimei reads that file again whenever it changes. Only you edit it: the guard refuses any agent's write to it.
# No file: no rules, and the harness's own permission mode decides everything.
# A broken file (bad TOML, an unknown key, a rule with no match fields): seimei keeps the last good rules and
# tells you what is wrong, in the app and in its log.
#
# Each [[rule]] has match fields (every one given must hit) and an action.
#   tool    glob on the tool name: "Bash", "Edit", "mcp__discord__*". {a,b} for alternatives.
#   paths   globs, ~ is home. "dir/**" is anything below dir; plain "dir" is the folder itself.
#           A relative glob (".claude/settings.json") matches in any folder.
#   op      "read", "write" or "exec", or a list of them; the default is all three. Needs paths.
#           write covers create, edit, move and delete.
#           Paths come from tool args (Read, Edit, plugin tools that take a file) and from Bash
#           through the shell parser (redirects, cd, globs, NAME=dir).
#           rm -r, cp -r or tar on a folder reaches everything below it.
#           ls, stat and test count as no op. A path in code (python3 -c "...") counts as every op.
#   argv    Bash: the program, then words that must appear in that order (globs, {a,b})
#   pipe    Bash: one argv pattern per stage of a pipeline. The last stage also hits when it is fed
#           a substitution of the earlier ones: bash <(curl ..), sh -c "$(curl ..)".
#   input   fallback on the tool's input fields: a string is a regex on the field, anything else must be equal
#   facts   what a built-in plugin knows about the call (below), as globs
#   action  "deny", "card" or "allow"
#   message what the agent is told (deny), or the card's title (card) when the plugin has none of its own
#
# Precedence: seimei splits a call into pieces. A piece is one path the call touches, with its op,
# the command that touches it, and the tool. A call that touches no path is one piece.
# For each piece, the first rule in file order that matches decides.
# The call as a whole gets the strictest answer of its pieces: deny > card > allow.
# So an "allow" exception goes above the rule it carves out of.
# When no rule matches, seimei adds nothing and the harness's own permission mode decides.
# "allow" never skips the harness's own prompts.
#
# A card waits 10 minutes for your answer. A card nobody answers counts as deny.
#
# Facts the built-in plugins give:
#   mcp__desktop__*         desktop = "quit" (ends the session), "close" (a window seimei did not open)
#                           or "config" (an edit of the window manager's config). Bash commands that
#                           do the same (niri msg action quit) get the same facts.
#   mcp__discord__*         author = "you" or "someone else": whose message an edit, delete or react is on
#   mcp__browser__browser_close   tabs = "theirs" (tabs seimei did not open) or "mine"
#
# Built in, whatever this file says: agents cannot change this file, a command nested too deep to
# check is refused, and the stop key and the login tripwire work as before.

# --- Wiping out: first, so its message is the one told (rm -r ~ reaches the secrets below too) ---

# A recursive delete of home, /home or /. (rm -rf ~/* and rm -rf * in home count: dir/* is dir.)
#[[rule]]
#argv    = ["rm", "{-*[rR]*,--recursive}"]
#paths   = ["~", "/", "/home"]
#op      = "write"
#action  = "deny"
#message = "deleting your home folder or the whole disk"

