[workspace]
resolver = "3"
members = ["crates/proto"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# The inner loop is `cargo check` on one crate; dependencies build once, a little optimized.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
