[workspace]
resolver = "3"
members = ["crates/proto", "crates/core", "crates/server", "crates/seimei", "plugins/browser", "plugins/desktop", "plugins/discord", "plugins/music", "plugins/queue"]

[workspace.package]
edition = "2024"
rust-version = "1.86"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# The inner loop is `cargo check` on one crate; dependencies build once, a little optimized.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# Release binaries are what `seimei update` installs: small and whole-program optimized. Panics still unwind: tokio
# catches a panicking task or request handler and the server lives on, where abort would end every running shikigami.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
